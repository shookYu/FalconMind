name: FalconMind Tests

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, develop, master ]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC

env:
  BUILD_TYPE: Release

jobs:
  # ========================================================================
  # C++ Build and Test
  # ========================================================================
  test-cpp:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install C++ dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          libssl-dev \
          libcurl4-openssl-dev \
          nlohmann-json3-dev \
          libcpp-httplib-dev
    
    - name: Configure CMake
      run: |
        cd FalconMindSDK
        mkdir -p build
        cd build
        cmake -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} ..
    
    - name: Build
      run: |
        cd FalconMindSDK/build
        cmake --build . --config ${{ env.BUILD_TYPE }} -- -j$(nproc)
    
    - name: Run All C++ Tests
      run: |
        cd FalconMindSDK/build
        ctest --output-on-failure -C ${{ env.BUILD_TYPE }}
    
    - name: Test Summary
      if: always()
      run: |
        cd FalconMindSDK/build
        echo "### C++ Test Results" >> $GITHUB_STEP_SUMMARY
        ctest --output-on-failure || true

  # ========================================================================
  # C++ Test Coverage
  # ========================================================================
  cpp-coverage:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          libssl-dev \
          libcurl4-openssl-dev \
          nlohmann-json3-dev \
          libcpp-httplib-dev \
          lcov
        pip install gcovr
    
    - name: Build with coverage
      run: |
        cd FalconMindSDK
        mkdir -p build-coverage
        cd build-coverage
        cmake -DCMAKE_BUILD_TYPE=Debug \
              -DFALCONMINDSDK_ENABLE_COVERAGE=ON \
              -DFALCONMINDSDK_BUILD_TESTS=ON \
              ..
        make -j$(nproc)
    
    - name: Run tests and generate coverage
      run: |
        cd FalconMindSDK/build-coverage
        ctest --output-on-failure
        
        # Generate coverage report
        lcov --capture --directory . --output-file coverage.info
        lcov --remove coverage.info '*/3rd/*' '*/tests/*' '/usr/*' --output-file coverage-filtered.info
        
        # Generate HTML report
        genhtml coverage-filtered.info --output-directory coverage-report --branch-coverage
        
        # Print summary
        echo "### C++ Coverage Summary" >> $GITHUB_STEP_SUMMARY
        lcov --summary coverage-filtered.info 2>&1 | grep -E "(lines|functions)" >> $GITHUB_STEP_SUMMARY
    
    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: cpp-coverage-report
        path: FalconMindSDK/build-coverage/coverage-report

  # ========================================================================
  # C++ Code Quality
  # ========================================================================
  cpp-quality:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install tools
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-format cppcheck
    
    - name: Check C++ formatting
      run: |
        find FalconMindSDK \
          -path "*/3rd/*" -prune -o \
          -path "*/build*/*" -prune -o \
          -path "*/install/*" -prune -o \
          \( -name "*.cpp" -o -name "*.h" -o -name "*.hpp" \) -print \
          | xargs clang-format --dry-run --Werror 2>&1 | head -50 || {
            echo "::warning::Code formatting issues found. Run: find FalconMindSDK -name '*.cpp' -o -name '*.h' | xargs clang-format -i"
            exit 0
          }
    
    - name: Run cppcheck static analysis
      run: |
        cppcheck \
          --enable=all \
          --suppress=missingIncludeSystem \
          --suppress=unusedFunction \
          --error-exitcode=0 \
          --inline-suppr \
          -I FalconMindSDK/include \
          FalconMindSDK/src \
          FalconMindSDK/tests \
          2>&1 | head -100

  # ========================================================================
  # Python Tests
  # ========================================================================
  test-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y mosquitto mosquitto-clients
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        pip install -r ClusterCenter/backend/requirements.txt
        pip install -r FalconMindViewer/backend/requirements.txt
        pip install -r FalconMindBuilder/backend/requirements.txt
    
    - name: Run ClusterCenter tests
      run: |
        cd ClusterCenter/backend
        python -m pytest tests/ -v --cov=. --cov-report=xml --cov-report=html
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./ClusterCenter/backend/coverage.xml
        flags: python
        name: python-coverage

  # ========================================================================
  # Python Code Quality
  # ========================================================================
  python-quality:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install linting tools
      run: |
        pip install black flake8 mypy
    
    - name: Check Python formatting with black
      run: |
        black --check ClusterCenter/backend/ FalconMindViewer/backend/ FalconMindBuilder/backend/ || {
          echo "::warning::Black formatting issues found"
          exit 0
        }
    
    - name: Lint Python code with flake8
      run: |
        flake8 ClusterCenter/backend/ FalconMindViewer/backend/ FalconMindBuilder/backend/ \
          --count --select=E9,F63,F7,F82 --show-source --statistics || {
            echo "::warning::Flake8 issues found"
            exit 0
          }

  # ========================================================================
  # Security Scan
  # ========================================================================
  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install security tools
      run: |
        pip install bandit safety
    
    - name: Run bandit security scan
      run: |
        bandit -r ClusterCenter/backend/ FalconMindViewer/backend/ FalconMindBuilder/backend/ \
          -f json -o bandit-report.json || echo "Bandit issues found"
    
    - name: Check dependencies for vulnerabilities
      run: |
        safety check -r ClusterCenter/backend/requirements.txt || true
        safety check -r FalconMindViewer/backend/requirements.txt || true
        safety check -r FalconMindBuilder/backend/requirements.txt || true

  # ========================================================================
  # Build Status Summary
  # ========================================================================
  build-status:
    runs-on: ubuntu-latest
    needs: [test-cpp, cpp-coverage, cpp-quality, test-python, python-quality, security-scan]
    if: always()
    
    steps:
    - name: Generate build status report
      run: |
        echo "# FalconMind Build Status" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Build Information" >> $GITHUB_STEP_SUMMARY
        echo "- **Date:** $(date)" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Ref:** ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Test Results" >> $GITHUB_STEP_SUMMARY
        echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| C++ Tests | ${{ needs.test-cpp.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| C++ Coverage | ${{ needs.cpp-coverage.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| C++ Quality | ${{ needs.cpp-quality.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Python Tests | ${{ needs.test-python.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Python Quality | ${{ needs.python-quality.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Security Scan | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Determine overall status
        if [[ "${{ needs.test-cpp.result }}" == "success" && \
              "${{ needs.test-python.result }}" == "success" ]]; then
          echo "## ✅ Overall Status: PASSED" >> $GITHUB_STEP_SUMMARY
        else
          echo "## ❌ Overall Status: FAILED" >> $GITHUB_STEP_SUMMARY
        fi
