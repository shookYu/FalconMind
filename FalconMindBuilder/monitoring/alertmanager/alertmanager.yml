# AlertManager Configuration
global:
  smtp_smarthost: 'localhost:587'
  smtp_from: 'alerts@falconmind.local'
  smtp_auth_username: ''
  smtp_auth_password: ''
  smtp_require_tls: true

  slack_api_url: ''

  pagerduty_url: 'https://events.pagerduty.com/v2/enqueue'

  resolve_timeout: 5m

# Templates
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Routing tree
route:
  group_by: ['alertname', 'severity', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: 'default'
  
  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 10s
      repeat_interval: 5m
    
    # UAV-specific alerts
    - match:
        service: uav
      receiver: 'uav-alerts'
      group_by: ['uav_id', 'uav_name']
    
    # Database alerts
    - match:
        service: database
      receiver: 'database-alerts'
      group_wait: 1m

# Receivers
receivers:
  - name: 'default'
    email_configs:
      - to: 'admin@falconmind.local'
        subject: 'FalconMind Alert: {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Status: {{ .Status }}
          {{ end }}

  - name: 'critical-alerts'
    email_configs:
      - to: 'oncall@falconmind.local'
        subject: '[CRITICAL] FalconMind Alert: {{ .GroupLabels.alertname }}'
        send_resolved: true
    
    slack_configs:
      - channel: '#critical-alerts'
        title: 'Critical Alert: {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          {{ end }}
        send_resolved: true

  - name: 'uav-alerts'
    email_configs:
      - to: 'uav-ops@falconmind.local'
        subject: 'UAV Alert: {{ .GroupLabels.uav_name }}'
        send_resolved: true

  - name: 'database-alerts'
    email_configs:
      - to: 'dba@falconmind.local'
        subject: 'Database Alert: {{ .GroupLabels.alertname }}'
        send_resolved: true

# Inhibition rules
inhibit_rules:
  # Inhibit warning if critical is firing
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service']
