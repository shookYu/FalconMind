# Prometheus Configuration for FalconMindBuilder
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'falconmind'
    replica: '{{.ExternalURL}}'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  - "/etc/prometheus/rules/*.yml"

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # FalconMindBuilder Backend API
  - job_name: 'falconmind-builder'
    static_configs:
      - targets: ['builder-backend:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # FalconMindConsole Backend API (if available)
  - job_name: 'falconmind-console'
    static_configs:
      - targets: ['console-backend:8080']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # Node Exporter for system metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s

  # cAdvisor for container metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 15s

  # UAV Telemetry Exporter (if available)
  - job_name: 'uav-telemetry'
    static_configs:
      - targets: ['uav-exporter:9101']
    scrape_interval: 5s
    scrape_timeout: 3s

# Storage configuration
storage:
  tsdb:
    retention.time: 30d
    retention.size: 10GB
