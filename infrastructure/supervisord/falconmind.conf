; FalconMind SupervisorD Configuration
; Process management for all 9 business processes

[supervisord]
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root
nodaemon=false

; RPC interface for supervisorctl
[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; Supervisorctl configuration
[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; Unix socket for RPC
[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

; =============================================================================
; Video Capture Process
; =============================================================================
[program:video_capture]
command=/opt/falconmind/bin/video_capture_process --config /etc/falconmind/video_capture.yaml
autostart=true
autorestart=true
startretries=3
user=falconmind
stdout_logfile=/var/log/falconmind/video_capture.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/var/log/falconmind/video_capture_error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
environment=FALCONMIND_PROCESS_NAME="video_capture"
priority=10

