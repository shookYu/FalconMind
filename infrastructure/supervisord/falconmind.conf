autorestart=true
startretries=10                    ; Higher retry count for system manager
user=root                          ; Root required for process management
stdout_logfile=/var/log/falconmind/system_manager.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/var/log/falconmind/system_manager_error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
environment=FALCONMIND_PROCESS_NAME="system_manager"
priority=5                         ; Start first

; =============================================================================
; Group Definitions
; =============================================================================
[group:falconmind]
programs=video_capture,perception,vins_slam,gps_defense,mission_planner,guidance,flight_control,data_logger,system_manager
priority=999

; Core processes group (always running)
[group:falconmind_core]
programs=video_capture,perception,vins_slam,gps_defense,flight_control,data_logger,system_manager
priority=998

; Mission processes group (started on demand)
[group:falconmind_mission]
programs=mission_planner,guidance
priority=997
