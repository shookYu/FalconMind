# NanoMQ Access Control Lists (ACL)
# Production-grade permission definitions
# 
# Permission levels:
#   - permit: allow / deny
#   - username: user pattern ("#" = all users)
#   - action: publish / subscribe / pubsub
#   - topics: list of topic patterns
#   - ipaddr: source IP restriction (optional)

rules = [
    # =========================================================================
    # SYSTEM PROCESSES - Full access (for internal UAV processes)
    # =========================================================================
    
    # System processes can publish to all topics
    {
        permit = allow
        username = "falconmind-system"
        action = publish
        topics = [
            "falconmind/#"
            "broadcast/#"
        ]
    }
    
    # System processes can subscribe to all topics
    {
        permit = allow
        username = "falconmind-system"
        action = subscribe
        topics = [
            "falconmind/#"
            "broadcast/#"
            "webrtc/#"
        ]
    }
    
    # =========================================================================
    # GROUND CONTROL STATION - Command access
    # =========================================================================
    
    # GCS can publish commands
    {
        permit = allow
        username = "falconmind-ground"
        action = publish
        topics = [
            "falconmind/command"
            "falconmind/mission/command"
            "falconmind/guidance/target"
        ]
    }
    
    # GCS can subscribe to all telemetry and status
    {
        permit = allow
        username = "falconmind-ground"
        action = subscribe
        topics = [
            "falconmind/telemetry/#"
            "falconmind/detection/#"
            "falconmind/tracking/#"
            "falconmind/navigation/#"
            "falconmind/mission/#"
            "falconmind/system/#"
            "falconmind/video/#"
            "broadcast/#"
        ]
    }
    
    # =========================================================================
    # WEB VIEWERS - Read-only access (limited scope)
    # =========================================================================
    
    # Viewers can only subscribe (no publishing)
    {
        permit = allow
        username = "falconmind-viewer"
        action = subscribe
        topics = [
            "falconmind/telemetry/position"
            "falconmind/telemetry/attitude"
            "falconmind/telemetry/battery"
            "falconmind/detection/targets"
            "falconmind/tracking/tracks"
            "falconmind/mission/status"
            "falconmind/video/streams"
            "falconmind/system/health"
        ]
    }
    
    # Explicitly deny publishing for viewers
    {
        permit = deny
        username = "falconmind-viewer"
        action = publish
        topics = ["#"]
    }
    
    # =========================================================================
    # BROADCAST TOPICS - Allow all authenticated users
    # =========================================================================
    
    {
        permit = allow
        username = "#"
        action = subscribe
        topics = [
            "broadcast/discovery"
            "broadcast/time_sync"
            "broadcast/emergency"
        ]
    }
    
    # =========================================================================
    # WEBRTC SIGNALING - For video streaming
    # =========================================================================
    
    {
        permit = allow
        username = "#"
        action = pubsub
        topics = [
            "webrtc/offer/#"
            "webrtc/answer/#"
            "webrtc/ice/#"
            "webrtc/control/#"
        ]
    }
    
    # =========================================================================
    # SYSTEM ADMIN TOPICS - Restricted access
    # =========================================================================
    
    # Only system processes can publish admin topics
    {
        permit = deny
        username = "#"
        action = pubsub
        topics = [
            "falconmind/admin/#"
            "$SYS/#"
        ]
    }
    
    {
        permit = allow
        username = "falconmind-system"
        action = pubsub
        topics = [
            "falconmind/admin/#"
            "$SYS/#"
        ]
    }
    
    # =========================================================================
    # DENY ALL OTHER ACCESS
    # =========================================================================
    
    # Default deny rule
    {
        permit = deny
        username = "#"
        action = pubsub
        topics = ["#"]
    }
]
