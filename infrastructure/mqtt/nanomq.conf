# NanoMQ Configuration - Production Grade
# FalconMind UAV Swarm Communication Platform
# 
# Security Features:
# - TLS 1.3 encryption
# - ACL-based access control
# - Authentication required
# - Rate limiting
#
# Performance Features:
# - Multi-core parallel processing
# - Connection pooling
# - Message persistence
# - Auto-scaling workers

system {
    # Worker threads - optimized for RK3588 (4 performance cores)
    # Each worker handles ~1000 concurrent connections
    num_taskq_thread = 4
    max_taskq_thread = 8
    parallel = 4
    
    # Enable QoS 2 message persistence
    qos_duration = 10s
    
    # Keep alive interval
    keepalive_backoff = 3
    
    # Max packet size (256MB for video metadata)
    max_packet_size = 268435456
    
    # Client ID length limit
    clientid_max_length = 65535
}

# MQTT Listeners
listeners {
    # TCP listener - internal swarm communication
    tcp {
        bind = "0.0.0.0:1883"
        
        # Connection limits
        max_connections = 10000
        
        # Rate limiting per client
        max_conn_rate = 1000
        max_msg_rate = 10000
        
        # TCP keepalive
        tcp_keepalive = 300
        tcp_keepidle = 300
        tcp_keepintvl = 30
        tcp_keepcnt = 3
    }
    
    # TLS listener - external/secure communication
    ssl {
        bind = "0.0.0.0:8883"
        
        # TLS configuration
        keyfile = "/etc/nanomq/certs/server.key"
        certfile = "/etc/nanomq/certs/server.crt"
        cacertfile = "/etc/nanomq/certs/ca.crt"
        
        # TLS version (production: only TLS 1.2+)
        tls_version = "tlsv1.3"
        
        # Cipher suites
        ciphers = "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384"
        
        # Client certificate verification (optional for UAVs)
        verify_peer = false
        fail_if_no_peer_cert = false
        
        # Connection limits
        max_connections = 5000
    }
    
    # WebSocket listener - web dashboard
    ws {
        bind = "0.0.0.0:8083"
        
        # WebSocket specific
        websocket_timeout = 5s
        
        # CORS origins (restrict in production)
        allow_origin = "*"
        
        # Compression
        enable_permessage_deflate = true
        
        max_connections = 2000
    }
    
    # WebSocket Secure listener
    wss {
        bind = "0.0.0.0:8084"
        
        keyfile = "/etc/nanomq/certs/server.key"
        certfile = "/etc/nanomq/certs/server.crt"
        cacertfile = "/etc/nanomq/certs/ca.crt"
        
        tls_version = "tlsv1.3"
        verify_peer = false
        fail_if_no_peer_cert = false
        
        max_connections = 1000
    }
}

# HTTP Management API
http_server {
    port = 8081
    
    # Authentication
    username = "admin"
    password = "${NANOMQ_ADMIN_PASSWORD}"  # Set via environment variable
    auth_type = basic
    
    # Rate limiting
    max_limit_conn = 256
    
    # JWT configuration (alternative to basic auth)
    # jwt {
    #     public_keyfile = "/etc/nanomq/certs/jwt.pub"
    # }
}

# Authentication
auth {
    # Require authentication
    allow_anonymous = false
    
    # Password hash method
    password_hash = sha256
    
    # HTTP authentication backend (for external auth)
    # http_auth {
    #     enable = false
    #     auth_req {
    #         url = "http://auth-service:8080/auth"
    #         method = post
    #         headers.content-type = "application/json"
    #     }
    # }
    
    # Built-in user database
    users = [
        {
            username = "falconmind-system"
            password = "${SYSTEM_PASSWORD}"  # System process user
        }
        {
            username = "falconmind-ground"
            password = "${GROUND_PASSWORD}"  # Ground control station
        }
        {
            username = "falconmind-viewer"
            password = "${VIEWER_PASSWORD}"  # Web viewers (read-only)
        }
    ]
}

# Access Control Lists (ACL)
auth {
    acl {
        enable = true
        
        # Deny all by default
        allow_anonymous = false
        
        # Use external ACL file
        acl_file = "/etc/nanomq/acl.conf"
        
        # Cache ACL entries
        cache_ttl = 5m
    }
}

# Logging configuration
log {
    to = [file, console]
    level = warn
    
    # Log file rotation
    dir = "/var/log/nanomq"
    file = "nanomq.log"
    
    rotation {
        size = 100MB
        count = 10
    }
    
    # Log format
    format = "timestamp_level_message"
    
    # Suppress sensitive data
    suppress_log_for = [password, token, secret]
}

# Message persistence (for QoS 1/2)
sqlite {
    enable = true
    disk_cache_size = 102400
    mounted_file_path = "/var/lib/nanomq/nanomq.db"
    flush_mem_threshold = 100
    resend_interval = 5000
}

# Webhook for integration
webhook {
    enable = true
    url = "${WEBHOOK_URL}"
    
    headers {
        content-type = "application/json"
        authorization = "Bearer ${WEBHOOK_TOKEN}"
    }
    
    body {
        encoding = plain
        field = "payload"
    }
    
    # Events to publish
    events = [
        "client.connect"
        "client.disconnect"
        "message.publish"
        "message.delivered"
    ]
    
    # Connection pool
    pool_size = 32
    
    # Timeout
    timeout = 5s
}

# MQTT bridging to cloud (for fleet management)
bridges {
    mqtt {
        name = cloud-backbone
        enable = false  # Enable when cloud connectivity available
        
        server = "${CLOUD_MQTT_HOST}"
        proto_ver = 5  # MQTT 5.0
        clientid = "falconmind-edge-${UAV_ID}"
        keepalive = 60s
        clean_start = true
        
        # TLS for cloud connection
        ssl {
            enable = true
            keyfile = "/etc/nanomq/certs/cloud-client.key"
            certfile = "/etc/nanomq/certs/cloud-client.crt"
            cacertfile = "/etc/nanomq/certs/cloud-ca.crt"
        }
        
        # Topic forwarding rules
        forwards = [
            {
                remote_topic = "fleet/${FLEET_ID}/uav/${UAV_ID}/telemetry/#"
                local_topic = "falconmind/telemetry/#"
                qos = 1
            }
            {
                remote_topic = "fleet/${FLEET_ID}/uav/${UAV_ID}/detection/#"
                local_topic = "falconmind/detection/#"
                qos = 1
            }
        ]
        
        # Subscription from cloud
        subscription = [
            {
                remote_topic = "fleet/${FLEET_ID}/uav/${UAV_ID}/command"
                local_topic = "falconmind/command"
                qos = 2
            }
            {
                remote_topic = "fleet/${FLEET_ID}/broadcast/#"
                local_topic = "falconmind/broadcast/#"
                qos = 1
            }
        ]
        
        # Parallel connections for throughput
        parallel = 2
    }
}

# Rule engine (for data transformation)
rule {
    enable = false
    
