version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: falconmind-postgres
    environment:
      POSTGRES_USER: falconmind
      POSTGRES_PASSWORD: falconmind123
      POSTGRES_DB: falconmind
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U falconmind"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - falconmind-network

  redis:
    image: redis:7-alpine
    container_name: falconmind-redis
    command: redis-server --requirepass falconmind123
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - falconmind-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: falconmind-backend
    ports:
      - "9000:9000"
    environment:
      DATABASE_URL: postgresql://falconmind:falconmind123@postgres:5432/falconmind
      REDIS_URL: redis://:falconmind123@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      ENVIRONMENT: production
      ENABLE_CLUSTER_FEATURES: "true"
      ENABLE_CONFLICT_RESOLUTION: "true"
      AUTO_INIT_DB: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - falconmind-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: falconmind-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - falconmind-network
    restart: unless-stopped

  nginx:
    image: nginx:stable
    container_name: falconmind-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs/dev:/etc/ssl/certs:ro
      - ./nginx/certs/dev:/etc/ssl/private:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:

networks:
  falconmind-network:
    driver: bridge
